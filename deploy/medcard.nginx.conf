# ============================================
# 医学记忆卡 · nginx 配置模板
# 保存到: /etc/nginx/sites-available/medcard
# 启用:   sudo ln -s /etc/nginx/sites-available/medcard /etc/nginx/sites-enabled/
#         先删默认站: sudo rm /etc/nginx/sites-enabled/default
# 测试:   sudo nginx -t && sudo systemctl reload nginx
# 注意:   证书由 certbot 签发后路径即生效（见 README）
# ============================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name medcard.icu;
    return 301 https://$host$request_uri;
}

# HTTPS 站点
server {
    listen 443 ssl http2;
    server_name medcard.icu;

    # certbot 生成的证书（先跑 certbot 再 reload nginx）
    ssl_certificate     /etc/letsencrypt/live/medcard.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medcard.icu/privkey.pem;

    # 上传限制：web 版上传文件限 4MB（nginx 默认 1m 会挡，必须调大）
    client_max_body_size 5m;

    # favicon：浏览器默认请求 /favicon.ico → 指向站内图标，消除 404 噪音
    location = /favicon.ico {
        return 301 /static/icon.svg;
    }

    # 扫描器/敏感路径拦截（.env、wp-admin、配置探测等 → 直接 444 断开，不留日志噪音）
    location ~ ^/(\.env|\.env\..*|config\.json|\.git|wp-admin|wp-login|\.well-known) {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
